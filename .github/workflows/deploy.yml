name: Verify and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
      - run: pnpm test
      - run: pnpm typecheck

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
      - name: Prepare production configuration
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/configure-deploy.mjs
      - run: node scripts/check-deploy.mjs
      - run: pnpm build
      - name: Prepare Worker secrets
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: node scripts/write-worker-secrets.mjs "$RUNNER_TEMP/worker-secrets.json"
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate:remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Remove temporary secrets file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/worker-secrets.json"
